# ============================================================================
# SINGLE SOURCE OF TRUTH for user environment (env vars + PATH).
# This is the ONLY file you edit. Both fish and bash, all systemd user
# services, and GUI apps (DMS/Hyprland/kitty) derive their env from here.
#
# How it reaches everything:
#   1. systemd's native environment.d reader parses this file when the user
#      manager starts (at login) and exports every KEY=VALUE to all services.
#   2. dotenv-export.service re-reads this file, expands $HOME, and pushes the
#      result into the manager *before* the graphical session reads it
#      (ordering enforced by the service unit), so GUI apps see it too.
#   3. fish and bash read this SAME file at startup (see their config files)
#      and apply the vars + PATH. No duplicated values anywhere.
#
# Format: KEY=VALUE, one per line. Use $HOME (NOT ~) for home-relative paths.
# Lines starting with # are ignored. Quote values only if they contain spaces.
# ============================================================================

# --- PATH (complete, explicit, no $PATH self-reference) ---------------------
# A full literal PATH. systemd's environment.d reader cannot reliably expand
# "$PATH" (self-reference) at boot, so we list every directory explicitly.
# Order matters: earlier = higher priority. Your tools first, system last.
PATH=$HOME/.local/bin:$HOME/.local/share/vite-plus/bin:$HOME/.local/share/bun/bin:$HOME/.local/share/soar/bin:$HOME/.local/share/krew/bin:$HOME/.local/share/pnpm/bin:$HOME/.pmg/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/bin

# --- Hermes Agent -----------------------------------------------------------
# Real home lives under XDG data, NOT the ~/.hermes fallback. GUI launchers
# (DMS, .desktop) don't inherit fish's exports; without this the desktop app
# falls back to ~/.hermes and creates a fresh empty profile.
HERMES_HOME=$HOME/.local/share/hermes

# --- Bun runtime -------------------------------------------------------------
BUN_INSTALL=$HOME/.local/share/bun
BUN_INSTALL_BIN=$HOME/.local/share/bun/bin

# --- OpenAI Codex ------------------------------------------------------------
CODEX_HOME=$HOME/.config/codex

# --- Kiro --------------------------------------------------------------------
# Global Kiro CLI configuration.
KIRO_HOME=$HOME/.config/kiro
# Kiro Crew persistent state.
KIROCREW_HOME=$HOME/.local/share/kirocrew

# --- T3 Code -----------------------------------------------------------------
# Base dir for state/db/secrets/caches (runtime state lands in <base>/userdata).
# Without this the app falls back to ~/.t3. Equivalent to `t3 --base-dir`.
T3CODE_HOME=$HOME/.local/share/t3code

# --- kubectl — KUBECONFIG is a file path, not a directory -------------------
KUBECONFIG=$HOME/.config/kube/config

# --- krew (kubectl plugin manager) ------------------------------------------
KREW_ROOT=$HOME/.local/share/krew

# --- Oracle Cloud Infrastructure CLI — force XDG paths, no files under $HOME.
OCI_CLI_CONFIG_FILE=$HOME/.config/oci/config
OCI_CLI_KEY_FILE=$HOME/.local/share/oci/oci_api_key.pem
OCI_CLI_RC_FILE=$HOME/.config/oci/cli-rc
OCI_DEVELOPER_TOOL_CONFIGURATION_FILE_PATH=$HOME/.config/oci/developer-tool-configuration.json
OCI_CLI_SECURITY_TOKEN_FILE=$HOME/.cache/oci/sessions/token

# --- Ollama ------------------------------------------------------------------
OLLAMA_HOME=$HOME/.config/ollama
OLLAMA_MODELS=$HOME/.local/share/ollama/models

# --- Editor and pager --------------------------------------------------------
EDITOR=nvim
MANPAGER="sh -c 'sed -u -e \"s/\\x1B\\[[0-9;]*m//g; s/.\\x08//g\" | bat -p -lman'"

# --- Starship prompt config --------------------------------------------------
STARSHIP_CONFIG=$HOME/.config/starship/starship.toml

# --- XDG-compliant tool locations -------------------------------------------
CARGO_HOME=$HOME/.local/share/cargo
GEMINI_CLI_HOME=$HOME/.config
NODE_REPL_HISTORY=$HOME/.local/share/node_repl_history
RBENV_ROOT=$HOME/.local/share/rbenv
WGETRC=$HOME/.config/wgetrc

# --- npm ---------------------------------------------------------------------
# Cache was 9.8G sitting in ~/.npm. It is a cache, so it belongs under
# XDG_CACHE_HOME, not $HOME. Keys MUST be lowercase: npm and node-gyp read
# process.env.npm_config_* verbatim and do not uppercase-match.
npm_config_cache=$HOME/.cache/npm
NPM_CONFIG_USERCONFIG=$HOME/.config/npm/npmrc

# --- node-gyp / electron-gyp header cache ------------------------------------
# Deliberately NOT set. node-gyp already defaults to ~/.cache/node-gyp via
# env-paths, so no var is needed for it. Setting npm_config_devdir makes npm
# print "Unknown env config devdir" on every invocation (arbitrary keys on
# npm's config were deprecated in npm v11, nodejs/node-gyp#3156) and will hard
# error in a future npm major. Electron tooling passes --devdir explicitly, which
# overrides env regardless, so ~/.electron-gyp can only be redirected per-project
# (project .npmrc or an explicit --devdir), not from here.

# --- Wine --------------------------------------------------------------------
# Prefix relocates cleanly: dosdevices uses relative "c: -> ../drive_c" and
# "z: -> /", so no absolute paths break on the move.
WINEPREFIX=$HOME/.local/share/wine

# --- GnuPG -------------------------------------------------------------------
# Directory must stay mode 700 or gpg refuses to use it. Agent sockets live
# under $XDG_RUNTIME_DIR and are unaffected by this path.
GNUPGHOME=$HOME/.local/share/gnupg

# --- Bundler (Ruby) ----------------------------------------------------------
BUNDLE_USER_HOME=$HOME/.local/share/bundle

# --- IPython -----------------------------------------------------------------
IPYTHONDIR=$HOME/.local/share/ipython

# --- AWS CLI -----------------------------------------------------------------
# Note: botocore hardcodes the SSO token cache to ~/.aws/sso/cache, so that one
# subdirectory will reappear under $HOME if you use `aws sso login`.
AWS_CONFIG_FILE=$HOME/.config/aws/config
AWS_SHARED_CREDENTIALS_FILE=$HOME/.config/aws/credentials

# --- boto / gsutil -----------------------------------------------------------
BOTO_CONFIG=$HOME/.config/boto

# --- PulseAudio --------------------------------------------------------------
PULSE_COOKIE=$HOME/.local/state/pulse/cookie

# --- GTK 2 -------------------------------------------------------------------
# Colon-separated list of rc files. /etc/gtk-2.0/gtkrc does not exist on this
# system, so the user file alone is the complete list.
GTK2_RC_FILES=$HOME/.config/gtk-2.0/gtkrc

# --- Bash history ------------------------------------------------------------
# History is mutable state, so XDG_STATE_HOME rather than config or data.
HISTFILE=$HOME/.local/state/bash/history

# --- Android emulator --------------------------------------------------------
# Emulator looks for the dotfile ".emulator_console_auth_token" *inside* this
# directory, so the leading dot on the filename is required.
ANDROID_EMULATOR_HOME=$HOME/.local/share/android/emulator

# --- Cline -------------------------------------------------------------------
# Root of Cline's storage; everything else (data/, cron/, the CA cert) hangs off
# it. Finer-grained overrides exist if ever needed -- CLINE_DATA_DIR,
# CLINE_SESSION_DATA_DIR, CLINE_TEAM_DATA_DIR, CLINE_DB_DATA_DIR,
# CLINE_GLOBAL_SETTINGS_PATH and others -- but CLINE_DIR covers all of them.
CLINE_DIR=$HOME/.local/share/cline

# --- Prime Agent -------------------------------------------------------------
# Resolver checks PRIME_AGENT_CODING_AGENT_DIR, then PI_CODING_AGENT_DIR, then
# falls back to ~/.prime/agent (rlm/harness.py, rlm/mcp_base.py). Note it names
# the "agent" subdirectory, not the parent, which is why the path ends in
# /agent. The kernel-venv underneath bakes absolute shebangs into its bin/
# scripts, so moving this directory means rewriting those too.
PRIME_AGENT_CODING_AGENT_DIR=$HOME/.local/share/prime/agent

# --- Portless ----------------------------------------------------------------
# Upstream calls this the "state" dir, but it holds the locally-generated CA
# key pair (ca-key.pem) and the ca.trusted marker, so it lives under data, not
# state: regenerating it means re-running `portless trust` with sudo and
# reissuing every host cert. Stop the proxy before changing this path, or a
# running daemon keeps writing to the old location.
PORTLESS_STATE_DIR=$HOME/.local/share/portless


CLAUDE_CONFIG_DIR=$HOME/.config/claude
