# ============================================================================
# WSL2 host override. Install ONLY on the WSL machine:
#
#     tuckr set dotenv bash fish
#     tuckr add dotenv-wsl
#
# Read AFTER dotenv.conf (lexical order, "zz-" sorts last), so anything set
# here wins. Only put values that genuinely differ from the Arch host here --
# everything else stays in dotenv.conf, which remains the single source.
#
# There is no systemd on this host, so dotenv-apply is the only consumer and
# dotenv-export.service is inert. That is fine: without a systemd user manager
# there are no services or graphical session needing a separate env push.
# ============================================================================

# --- PATH -------------------------------------------------------------------
# WSL normally appends the whole Windows PATH to every shell. dotenv.conf
# exports a full literal PATH, which wipes those entries -- so `clip.exe`,
# `explorer.exe` and friends stop resolving. Rather than let WSL inject a long
# machine-specific list we cannot review, turn the injection off and name the
# few interop paths we actually want, keeping PATH explicit like the Arch host.
#
# Add to /etc/wsl.conf (needs sudo, then `wsl --shutdown` from Windows):
#
#     [interop]
#     appendWindowsPath = false
#
# To see what WSL was injecting before you disable it:
#
#     tr ':' '\n' <<< "$PATH" | grep '^/mnt/'
#
# Then keep the entries you use below and drop the rest. Removed relative to
# the Arch host: /opt/rocm/bin (no AMD GPU passthrough) and the vite-plus /
# soar / krew dirs (add back per tool as you install it on this host).
PATH=$HOME/.local/bin:$HOME/.local/share/bun/bin:$HOME/.local/share/pnpm/bin:$HOME/.pmg/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/mnt/c/Windows/system32:/mnt/c/Windows

# --- Ollama -----------------------------------------------------------------
# Point at the Windows-side host instead of a Linux install: WSL2 has no GPU
# passthrough for this, and running a second copy of the models inside the
# distro doubles the disk. Comment out if you install Ollama in the distro.
OLLAMA_HOST=http://host.docker.internal:11434
